
<mat-toolbar color="primary" class="nav-height">
  <mat-toolbar-row>
    <button mat-icon-button>
      <mat-icon (click)="openLeftSide()">menu</mat-icon>
    </button>
    <h1>Stock Management</h1>
    <span class="menu-spacer" style="width: 100px;"></span>
   <div>
      <a mat-button routerLink="stocks" routerLinkActive="active">
        <mat-icon mat-list-icon>home</mat-icon> Home
      </a>
      <a mat-button routerLink="/login" routerLinkActive="active">
        <mat-icon mat-list-icon>login</mat-icon> Login
      </a>
      </div>
  </mat-toolbar-row>
  </mat-toolbar>
  <mat-sidenav-container >
    <mat-sidenav #sidenav (closed)="closeLeftSide()">
      <mat-nav-list>
        <a mat-list-item routerLink="stocks" routerLinkActive="active">
          <mat-icon mat-list-icon>home</mat-icon> Home
          </a>
        <a mat-list-item routerLink="/register" routerLinkActive="active">
          <mat-icon mat-list-icon>person_add</mat-icon> Register
        </a>
        <a mat-list-item routerLink="/create" routerLinkActive="active">
          <mat-icon mat-list-icon>add</mat-icon> Create Stock
        </a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <div style="
      height: 90vh;
      margin-top: 20px;
      margin-right: 10px;
      margin-left: 10px;"
      [ngClass]="{
        'content-move-left': !isOpened,
        'content-move-right' : isOpened
      }">
      <router-outlet></router-outlet>
   </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
