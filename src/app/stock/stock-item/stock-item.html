<td>{{stock.name}}</td>
<td>{{stock.code}}</td>

<td
  [class.positive]="stock.isPositiveChange()"
  [class.negative]="!stock.isPositiveChange()">
  ${{stock.price}}
</td>

<td>
  <button (click)="onToggleFavourite()">
    {{ stock.favorite ? '★ Unfavourite' : '☆ Favourite' }}
  </button>

  <button (click)="onUpdate()">✏️ Update</button>
  <button (click)="onDelete()">🗑️ Delete</button>
  <button (click)="viewDetailHandler()">🔍 View Details</button>
</td>
